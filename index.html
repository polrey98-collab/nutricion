html, body { background: #F5F0E8; }

.comp-card { background:var(--wh); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--sh); display:flex; align-items:center; gap:16px; }
.comp-r { flex:1; }

.trk-row { background:var(--wh); border-radius:12px; padding:13px 16px; display:flex; align-items:center; gap:13px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05); min-height:50px; }

.trk-ico { font-size:20px; flex-shrink:0; }

.now-tag { font-size:9.5px; background:var(--green); color:#fff; padding:2px 7px; border-radius:9px; margin-left:8px; font-weight:600; }
.chk-o { width:24px; height:24px; border-radius:50%; border:2px solid #C9C3BA; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px; }
.chk-o.ck { background:var(--green); border-color:var(--green); color:#fff; }
.chip-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 6px 2px; }
.chip-lbl { font-size:11px; color:var(--mu); font-weight:600; margin-right:2px; }
.chip { padding:5px 10px; border-radius:16px; border:1.5px solid var(--bd); background:var(--wh); font-size:11.5px; font-weight:500; color:var(--mu); cursor:pointer; font-family:var(--sans); }

.wk-dl { font-size:9.5px; color:var(--fa); font-weight:500; }

.wk-fill { width:100%; border-radius:4px; }
.wk-dn { font-size:9.5px; color:var(--fa); }
.var-card { background:var(--wh); border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.var-head { font-size:12px; font-weight:600; color:var(--green); margin-bottom:8px; }
.var-row { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12.5px; border-bottom:1px solid #F9F5EF; }

.var-ico { font-size:15px; }
.var-lbl { flex:1; color:var(--tx); }

function localDateStr(d){ d=d||new Date(); var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function shiftDate(s,delta){ var d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+delta); return localDateStr(d); }
function dowOf(s){ return new Date(s+"T12:00:00").getDay(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function parseDay(raw){ if(!raw) return {}; try{ var p=JSON.parse(raw); return (p && typeof p==="object" && !Array.isArray(p)) ? p : {}; }catch(e){ return {}; } }
function sanitizeDay(o){
var out={};
MEAL_IDS.forEach(function(id){ if(o[id]===true) out[id]=true; });
Object.keys(ENUM_FIELDS).forEach(function(f){ if(typeof o[f]==="string" && ENUM_FIELDS[f].indexOf(o[f])>=0) out[f]=o[f]; });
if(typeof o.gym==="boolean") out.gym=o.gym;
if(Array.isArray(o.fruta)){ var fr=o.fruta.filter(function(x){ return FRUIT_IDS.indexOf(x)>=0; }); if(fr.length) out.fruta=fr.slice(0,4); }
return out;
}

out+='<div class="var-hint" style="margin-top:8px">🔒 El token se guarda únicamente en este dispositivo (localStorage). Nunca se escribe en el código ni en el repositorio. El backup sube a <strong>data/backup.json</strong> de tu repo.</div>';
out+='</div>';
}
out+='<div class="disclaimer">ℹ️ Tus datos se guardan en este dispositivo. Con la sincronización GitHub activada, cada registro sube también una copia a tu repositorio.</div>';
return out;
}
function vHistorial(){
var ym=state.calMonth, y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)-1;
var canNextMon = ym < TODAY.slice(0,7);
var cells=monthCells(ym);
var wd=["L","M","X","J","V","S","D"];
function lvl(c){ if(c<=0)return 0; if(c<=1)return 1; if(c<=2)return 2; if(c<=4)return 3; return 4; }
var out='<div class="cal-nav"><button class="dn-arrow" data-act="calprev">‹</button><div class="dn-center"><div class="cal-mon">'+MONTH_NAMES[m]+' '+y+'</div></div><button class="dn-arrow" data-act="calnext"'+(canNextMon?'':' disabled')+'>›</button></div>';
out+='<div class="cal-card"><div class="cal-wd">';
wd.forEach(function(d){ out+='<span>'+d+'</span>'; });
out+='</div><div class="cal-grid">';
cells.forEach(function(dateStr){
if(!dateStr){ out+='<div class="cal-cell empty"></div>'; return; }
var dn=parseInt(dateStr.slice(8,10),10);
if(dateStr>TODAY){ out+='<div class="cal-cell future"><span class="cc-num">'+dn+'</span></div>'; return; }
var c=dayCount(dateStr);
var cls="cal-cell lvl"+lvl(c)+(dateStr===state.viewDate?" sel":"")+(dateStr===TODAY?" today":"");
out+='<div class="'+cls+'" data-act="calday" data-val="'+dateStr+'"><span class="cc-num">'+dn+'</span></div>';
});
out+='</div><div class="cal-legend"><span>menos</span><i style="background:#F4F1EB"></i><i style="background:#D8EFE2"></i><i style="background:#A7DBC0"></i><i style="background:#5FB088"></i><i style="background:#1A3C2A"></i><span>más comidas</span></div></div>';
// Monthly summary
var sm=monthSummary(ym);
var isCurMonth = ym===TODAY.slice(0,7);
var daysElapsed = isCurMonth ? parseInt(TODAY.slice(8,10),10) : new Date(y,m+1,0).getDate();
var pct = daysElapsed>0 ? Math.round(sm.mealsDone/(daysElapsed*5)*100) : 0;
out+='<div class="lst-ttl">📊 Resumen de '+MONTH_NAMES[m]+'</div>';
out+='<div class="sum-card"><div class="sum-kpis"><div class="sum-kpi"><div class="sum-kpi-n">'+sm.daysLogged+'</div><div class="sum-kpi-l">días registrados</div></div><div class="sum-kpi"><div class="sum-kpi-n">'+sm.mealsDone+'</div><div class="sum-kpi-l">comidas marcadas</div></div><div class="sum-kpi"><div class="sum-kpi-n">'+pct+'%</div><div class="sum-kpi-l">adherencia</div></div></div></div>';
["dinar","sopar"].forEach(function(mk){
out+='<div class="var-card"><div class="var-head">'+MEAL_META[mk].icon+' Hidratos en '+MEAL_META[mk].label.toLowerCase()+' · '+MONTH_NAMES[m]+'</div>';
HID_TARGETS[mk].forEach(function(g){
var cnt=(sm[mk]||{})[g.id]||0;
out+='<div class="var-row"><span class="var-ico">'+g.ico+'</span><span class="var-lbl">'+g.label+'</span><span class="var-cnt">'+cnt+'×</span></div>';
});
out+='</div>';
});
["dinar","sopar"].forEach(function(mk){
var pf=mk==="dinar"?"dinarP":"soparP";
out+='<div class="var-card"><div class="var-head">'+MEAL_META[mk].icon+' Proteína en '+MEAL_META[mk].label.toLowerCase()+' · '+MONTH_NAMES[m]+'</div>';
PROT_TARGETS[mk].forEach(function(g){
var cnt=(sm[pf]||{})[g.id]||0;
out+='<div class="var-row"><span class="var-ico">'+g.ico+'</span><span class="var-lbl">'+g.label+'</span><span class="var-cnt">'+cnt+'×</span></div>';
});
out+='</div>';
});
["dinar","sopar"].forEach(function(mk){
var vf=mk==="dinar"?"dinarV":"soparV";
out+='<div class="var-card"><div class="var-head">'+MEAL_META[mk].icon+' Verdura en '+MEAL_META[mk].label.toLowerCase()+' · '+MONTH_NAMES[m]+'</div>';
VEG_TARGETS[mk].forEach(function(g){
var cnt=(sm[vf]||{})[g.id]||0;
out+='<div class="var-row"><span class="var-ico">'+g.ico+'</span><span class="var-lbl">'+g.label+'</span><span class="var-cnt">'+cnt+'×</span></div>';
});
out+='</div>';
});
out+='<div class="var-card"><div class="var-head">🍇 Grupos de fruta · '+MONTH_NAMES[m]+'</div>';
FRUIT_CHIPS.forEach(function(g){
var cnt=(sm.fruta||{})[g.id]||0;
out+='<div class="var-row"><span class="var-ico">'+g.ico+'</span><span class="var-lbl">'+g.label+'</span><span class="var-cnt">'+cnt+'×</span></div>';
});
out+='</div>';
out+='<div class="var-hint">Toca cualquier día del calendario para abrirlo y editar su registro. Este resumen mensual es lo que puedes enseñar en tu revisión trimestral.</div>';
return out;
}
function vNav(){
var out='<nav class="bnav">';
TABS.forEach(function(t){ out+='<button class="bni'+(state.tab===t.id?" on":"")+'" data-act="tab" data-val="'+t.id+'"><span class="bni-ico">'+t.icon+'</span><span class="bni-lbl">'+t.label+'</span></button>'; });
out+='</nav>';
return out;
}
function view(){
var content = state.tab==="plan"?vPlan():state.tab==="opciones"?vOpciones():state.tab==="historial"?vHistorial():vHoy();
return '<div class="app">'+vHeader()+'<div class="scroll">'+content+'<div class="ver">Nutrición Pol · v'+APP_VERSION+' · '+APP_DATE+'</div></div>'+vNav()+'</div>';
}
var lastTab=null;
function render(){
var sc=document.querySelector(".scroll"), st=sc?sc.scrollTop:0;
var sameTab=lastTab===state.tab;
document.getElementById("app").innerHTML=view();
var ns=document.querySelector(".scroll");
if(ns&&sameTab) ns.scrollTop=st;
lastTab=state.tab;
}
// ── Events ──
document.getElementById("app").addEventListener("click", function(e){
var el=e.target.closest("[data-act]"); if(!el) return;
var act=el.dataset.act, val=el.dataset.val;
if(act==="tab"){ state.tab=val; }
else if(act==="planview"){ state.planView=val; }
else if(act==="openmeal"){ state.openMeal=state.openMeal===val?null:val; }
else if(act==="theory"){ state.openTheory=state.openTheory===val?null:val; }
else if(act==="optfilter"){ state.optFilter=val; state.openGroup=null; }
else if(act==="optgroup"){ state.openGroup=state.openGroup===val?null:val; }
else if(act==="toggle"){ var t=Object.assign({},state.tracking); t[val]=!t[val]; state.tracking=t; saveDay(state.viewDate,t); }
else if(act==="hid"){ var meal=el.dataset.meal, field=meal==="dinar"?"dinarH":"soparH"; var t2=Object.assign({},state.tracking); t2[field]=t2[field]===val?null:val; t2[meal]=true; state.tracking=t2; saveDay(state.viewDate,t2); }
else if(act==="veg"){ var mealV=el.dataset.meal, fieldV=mealV==="dinar"?"dinarV":"soparV"; var t3=Object.assign({},state.tracking); t3[fieldV]=t3[fieldV]===val?null:val; t3[mealV]=true; state.tracking=t3; saveDay(state.viewDate,t3); }
else if(act==="prot"){ var mealP=el.dataset.meal, fieldP=mealP==="dinar"?"dinarP":"soparP"; var t4=Object.assign({},state.tracking); t4[fieldP]=t4[fieldP]===val?null:val; t4[mealP]=true; state.tracking=t4; saveDay(state.viewDate,t4); }
else if(act==="fruit"){ var t5=Object.assign({},state.tracking); var fr=(t5.fruta||[]).slice(); var ix=fr.indexOf(val); if(ix>=0)fr.splice(ix,1); else fr.push(val); t5.fruta=fr; state.tracking=t5; saveDay(state.viewDate,t5); }
else if(act==="gym"){ var t6=Object.assign({},state.tracking); t6.gym=!isGymDay(state.viewDate,t6); state.tracking=t6; saveDay(state.viewDate,t6); }
else if(act==="date"){ var nd=shiftDate(state.viewDate, parseInt(val,10)); if(parseInt(val,10)>0 && nd>TODAY) return; state.viewDate=nd; state.tracking=loadDay(nd); }
else if(act==="today"){ state.viewDate=TODAY; state.tracking=loadDay(TODAY); }
else if(act==="setdate"){ state.viewDate=val; state.tracking=loadDay(val); }
else if(act==="calprev"){ state.calMonth=monthShift(state.calMonth,-1); }
else if(act==="calnext"){ if(state.calMonth<TODAY.slice(0,7)) state.calMonth=monthShift(state.calMonth,1); }
else if(act==="calday"){ state.viewDate=val; state.tracking=loadDay(val); state.tab="hoy"; }
else if(act==="export"){ state.exportOpen=!state.exportOpen; if(state.exportOpen){ state.exportText=buildExport(); state.copied=false; } }
else if(act==="copy"){
navigator.clipboard.writeText(state.exportText).then(function(){ state.copied=true; lsSet("nut:lastExport",TODAY); render(); }).catch(function(){ state.copied=false; render(); });
return;
}
else if(act==="import"){ state.importOpen=!state.importOpen; state.importMsg=""; }
else if(act==="sync"){ state.syncOpen=!state.syncOpen; state.syncMsg=""; }
else if(act==="syncnow"){
var oEl=document.getElementById("ghOwner"), rEl=document.getElementById("ghRepo"), tEl=document.getElementById("ghTok"), aEl=document.getElementById("ghAuto");
var cfgN={ owner:(oEl?oEl.value.trim():""), repo:(rEl?rEl.value.trim():""), branch:"main", auto:!!(aEl&&aEl.checked) };
lsSet("nut:ghcfg", JSON.stringify(cfgN));
var tokV=tEl?tEl.value.trim():"";
if(tokV) lsSet("nut:ghtoken", tokV);
syncNow(false);
return;
}
else if(act==="doimport"){
var ta=document.getElementById("importTA"); var raw=ta?ta.value.trim():"";
if(!raw){ state.importMsg="✗ Pega primero el texto del backup."; }
else { try {
var obj=JSON.parse(raw);
var days=(obj && typeof obj==="object" && obj.days && typeof obj.days==="object") ? obj.days : obj; // acepta backup v2 (con schema) y formato antiguo (plano)
var valid={}, overwrite=0;
Object.keys(days||{}).forEach(function(k){
if(/^\d{4}-\d{2}-\d{2}$/.test(k) && days[k] && typeof days[k]==="object" && !Array.isArray(days[k])){
var s=sanitizeDay(days[k]);
if(Object.keys(s).length){ valid[k]=s; if(lsGet("nut:"+k)) overwrite++; }
}
});
var n=Object.keys(valid).length;
if(!n){ state.importMsg="✗ No encontré días válidos en ese texto."; }
else if(overwrite>0 && !window.confirm("Este backup sobrescribirá "+overwrite+" día(s) que ya tienes registrados en este dispositivo. ¿Continuar?")){ state.importMsg="Importación cancelada — no se ha tocado nada."; }
else {
Object.keys(valid).forEach(function(k){ saveDay(k,valid[k]); });
state.tracking=loadDay(state.viewDate);
state.importMsg="✓ Importados "+n+" días"+(overwrite?" ("+overwrite+" sobrescritos)":"")+". ¡Listo!";
}
} catch(err){ state.importMsg="✗ El texto no es un backup válido (debe ser el JSON exportado)."; } }
}
render();
});
render();
// ── Refresco al volver a primer plano (la PWA puede quedarse abierta días) ──
document.addEventListener("visibilitychange", function(){
if(document.visibilityState!=="visible") return;
var nt=localDateStr(), nm=currentMeal(), changed=false;
if(nt!==TODAY){
if(state.viewDate===TODAY){ state.viewDate=nt; state.tracking=loadDay(nt); }
TODAY=nt; state.calMonth=TODAY.slice(0,7); changed=true;
}
if(nm!==NOW_MEAL){ NOW_MEAL=nm; changed=true; }
if(changed) render();
});
// ── Service worker (offline) ──
if("serviceWorker" in navigator){
window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
}
</script>
